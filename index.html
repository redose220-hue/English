<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOVEN Oral Lab | 授权版本</title>
    <style>
        /* 保持之前的 White & Gold UI 样式... */
        :root { --primary-gold: #D4AF37; --light-gold: #F4EBD0; --bg-white: #FFFFFF; --text-dark: #333333; }
        body { font-family: -apple-system, sans-serif; background: var(--bg-white); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        
        /* 授权遮罩层 */
        #authOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-white); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .auth-card {
            width: 80%; max-width: 300px; padding: 30px; border-radius: 20px;
            box-shadow: 0 10px 40px rgba(212,175,55,0.2); border: 1px solid var(--light-gold); text-align: center;
        }
        .auth-input {
            width: 100%; padding: 12px; margin: 20px 0; border: 1px solid var(--light-gold);
            border-radius: 10px; text-align: center; font-size: 18px; outline: none;
        }
        
        /* 之前的其他样式代码 (为了节省篇幅，这里略过，实际请使用上方完整样式) */
        .container { width: 100%; max-width: 500px; text-align: center; display:none; } /* 初始隐藏 */
        h1 { color: var(--primary-gold); letter-spacing: 3px; border-bottom: 1px solid var(--light-gold); }
        .checkin-box { background: var(--light-gold); padding: 18px; border-radius: 20px; border: 1px solid rgba(212,175,55,0.3); }
        /* ... 样式参考前一版 ... */
    </style>
</head>
<body>

<!-- 🔒 授权验证层 -->
<div id="authOverlay">
    <div class="auth-card">
        <div style="color:var(--primary-gold); font-size:18px; font-weight:bold; letter-spacing:2px;">MOVEN ORAL LAB</div>
        <div style="color:#999; font-size:12px; margin-top:10px;">请输入您的专属授权码</div>
        <input type="text" id="passInput" class="auth-input" placeholder="Enter License Key">
        <button onclick="checkAuth()" style="width:100%; padding:12px; background:var(--primary-gold); color:white; border-radius:10px; border:none; font-weight:bold;">激活实验室</button>
        <div style="font-size:10px; color:#ccc; margin-top:20px;">一本一码 · 严禁泄露</div>
    </div>
</div>

<!-- 📱 主程序容器 (验证通过后显示) -->
<div class="container" id="mainApp">
    <h1>MOVEN ORAL LAB</h1>
    <!-- ... 这里放入上一版的所有 HTML 内容 ... -->
</div>

<script>
    // ==========================================
    // 🔑 卖家修改区：给每个客户设置不同的密码
    // ==========================================
    const LICENSE_KEY = "MOVEN-888-666"; // 你把这个发给张三，就把这里改成张三专属
    // ==========================================

    function checkAuth() {
        const input = document.getElementById('passInput').value.trim();
        if (input === LICENSE_KEY) {
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            // 验证通过后存入 session，防止刷新页面又要输入
            sessionStorage.setItem('moven_auth', 'true');
        } else {
            alert("授权码错误，请联系主理人购买。");
        }
    }

    // 自动检查已登录状态
    if(sessionStorage.getItem('moven_auth') === 'true') {
        document.getElementById('authOverlay').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
    }

    /* ... 后面接上一版的业务逻辑 JS (打卡、视频、录音等) ... */
</script>
</body>
</html>
