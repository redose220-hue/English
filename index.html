<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOVEN Oral Lab Mobile</title>
    <style>
        :root {
            --primary-gold: #D4AF37;
            --light-gold: #F4EBD0;
            --bg-white: #FFFFFF;
            --text-dark: #333333;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg-white);
            color: var(--text-dark);
            margin: 0; padding: 10px;
            display: flex; flex-direction: column; align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        .container { width: 100%; max-width: 500px; text-align: center; }
        h1 { color: var(--primary-gold); font-size: 20px; letter-spacing: 1px; margin-bottom: 10px; }

        /* 视频容器适配手机 */
        .video-wrapper { position: relative; width: 100%; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 16/9; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        video { width: 100%; height: 100%; object-fit: contain; }
        .blind-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.4); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); display: none; align-items: center; justify-content: center; z-index: 10; color: var(--primary-gold); font-weight: bold; font-size: 18px; }

        .controls, .record-section, .list-section { margin-top: 12px; background: var(--light-gold); padding: 12px; border-radius: 12px; display: flex; flex-direction: column; gap: 8px; }

        button { padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; -webkit-appearance: none; }
        .btn-gold { background: var(--primary-gold); color: white; }
        .btn-silver { background: #E5E4E2; color: var(--text-dark); }
        .btn-record { background: #e74c3c; color: white; }
        
        .row { display: flex; gap: 6px; justify-content: center; width: 100%; flex-wrap: wrap; }
        .time-display { font-family: monospace; font-size: 16px; color: var(--primary-gold); margin: 5px 0; }

        #waveform { width: 100%; height: 60px; background: #fff; border-radius: 8px; display: none; }

        .snippet-item { background: #fff; border: 1px solid var(--light-gold); padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .snippet-info { flex: 1; text-align: left; }
        .snippet-info b { color: var(--primary-gold); font-size: 15px; }
        
        input[type="file"] { font-size: 12px; width: 100%; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>MOVEN ORAL LAB</h1>
    
    <div class="video-wrapper">
        <div id="blindOverlay" class="blind-overlay">🙈 听力磨练中...</div>
        <video id="mainVideo" controls playsinline webkit-playsinline></video>
    </div>
    
    <input type="file" id="fileInput" accept="video/*">

    <div class="controls">
        <button id="blindBtn" style="background:#333; color:var(--primary-gold);" onclick="toggleBlind()">🙈 开启盲听模式</button>
        <div class="row">
            <button class="btn-silver" onclick="skip(-2)">⏪ -2s</button>
            <button class="btn-silver" onclick="setPoint('start')">📍 起点</button>
            <button class="btn-silver" onclick="setPoint('end')">📍 终点</button>
        </div>
        <div class="time-display"><span id="startTime">0.0</span>s - <span id="endTime">0.0</span>s</div>
        <button id="loopBtn" class="btn-gold" onclick="toggleLoop()">开启循环跟读</button>
        <button class="btn-gold" style="background:#c5a02e;" onclick="saveSnippet()">💾 保存片段</button>
    </div>

    <div class="record-section">
        <canvas id="waveform"></canvas>
        <div class="row">
            <button id="recordBtn" class="btn-record" onclick="toggleRecord()">🎤 开始录制</button>
            <button id="playRecordBtn" style="background:#2ecc71; color:white;" onclick="playLastRecord()" disabled>▶️ 回放</button>
        </div>
    </div>

    <div id="snippetList" class="list-section">
        <p style="font-size:12px; color:#999;">暂无已存片段</p>
    </div>
</div>

<script>
    const video = document.getElementById('mainVideo');
    const fileInput = document.getElementById('fileInput');
    const blindOverlay = document.getElementById('blindOverlay');
    const canvas = document.getElementById('waveform');
    const ctx = canvas.getContext('2d');
    
    let start = 0, end = 0, isLooping = false, isBlind = false;
    let mediaRecorder, audioCtx, analyser, dataArray, animationId, audioUrl, isRecording = false;

    // 页面加载即刷新列表
    window.onload = () => { loadSnippets(); };

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) video.src = URL.createObjectURL(file);
    });

    function toggleBlind() {
        isBlind = !isBlind;
        blindOverlay.style.display = isBlind ? 'flex' : 'none';
        document.getElementById('blindBtn').innerText = isBlind ? "👁️ 关闭盲听" : "🙈 开启盲听";
    }

    function skip(s) { video.currentTime = Math.max(0, video.currentTime + s); }

    function setPoint(type) {
        if (type === 'start') { start = video.currentTime; document.getElementById('startTime').innerText = start.toFixed(1); }
        else { end = video.currentTime; document.getElementById('endTime').innerText = end.toFixed(1); }
    }

    function toggleLoop() {
        isLooping = !isLooping;
        document.getElementById('loopBtn').innerText = isLooping ? "停止循环" : "开启循环跟读";
        if(isLooping) { video.currentTime = start; video.play(); }
    }

    video.addEventListener('timeupdate', () => {
        if (isLooping && end > start && video.currentTime >= end) video.currentTime = start;
    });

    function saveSnippet() {
        const name = prompt("片段名称：");
        if (!name) return;
        const snippet = { id: Date.now(), name, start, end };
        let s = JSON.parse(localStorage.getItem('moven_mobile_snippets') || '[]');
        s.unshift(snippet);
        localStorage.setItem('moven_mobile_snippets', JSON.stringify(s));
        loadSnippets();
    }

    function loadSnippets() {
        const list = document.getElementById('snippetList');
        const snippets = JSON.parse(localStorage.getItem('moven_mobile_snippets') || '[]');
        if (snippets.length === 0) {
            list.innerHTML = '<p style="font-size:12px; color:#999;">暂无已存片段</p>';
            return;
        }
        list.innerHTML = snippets.map(s => `
            <div class="snippet-item">
                <div class="snippet-info">
                    <b>${s.name}</b><br>
                    <small>${s.start.toFixed(1)}s - ${s.end.toFixed(1)}s</small>
                </div>
                <button class="btn-silver" style="padding:5px 10px;" onclick="practiceSnippet(${s.start}, ${s.end})">练</button>
                <button onclick="deleteSnippet(${s.id})" style="background:none; color:#ff4d4d; border:none; font-size:20px; margin-left:10px;">×</button>
            </div>
        `).join('');
    }

    function practiceSnippet(s, e) {
        start = s; end = e;
        document.getElementById('startTime').innerText = s.toFixed(1);
        document.getElementById('endTime').innerText = e.toFixed(1);
        isLooping = true;
        document.getElementById('loopBtn').innerText = "停止循环";
        video.currentTime = s;
        video.play();
    }

    async function toggleRecord() {
        if (!isRecording) {
            try {
                // 解决手机端 AudioContext 必须由点击触发的问题
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') await audioCtx.resume();

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128; // 手机端用更小的采样提高性能
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                mediaRecorder = new MediaRecorder(stream);
                const chunks = [];
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'audio/mp4' }); // 手机端适配 mp4/aac 格式
                    audioUrl = URL.createObjectURL(blob);
                    document.getElementById('playRecordBtn').disabled = false;
                };
                
                mediaRecorder.start();
                isRecording = true;
                canvas.style.display = 'block';
                document.getElementById('recordBtn').innerText = "⏹ 停止";
                drawWave();
            } catch (err) { alert("请允许麦克风权限以录音。"); }
        } else {
            mediaRecorder.stop();
            isRecording = false;
            cancelAnimationFrame(animationId);
            document.getElementById('recordBtn').innerText = "🎤 开始录制";
        }
    }

    function drawWave() {
        animationId = requestAnimationFrame(drawWave);
        analyser.getByteFrequencyData(dataArray);
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const barWidth = (canvas.width / dataArray.length) * 2;
        let x = 0;
        for (let i = 0; i < dataArray.length; i++) {
            const barHeight = (dataArray[i] / 255) * canvas.height;
            ctx.fillStyle = '#D4AF37';
            ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
            x += barWidth + 2;
        }
    }

    function playLastRecord() {
        if (!audioUrl) return;
        const audio = new Audio();
        audio.src = audioUrl;
        audio.play().catch(e => alert("手机端播放失败，请尝试重新录制。"));
    }

    function deleteSnippet(id) {
        if(confirm("删除片段？")) {
            let s = JSON.parse(localStorage.getItem('moven_mobile_snippets') || '[]');
            localStorage.setItem('moven_mobile_snippets', JSON.stringify(s.filter(i => i.id !== id)));
            loadSnippets();
        }
    }
</script>
</body>
</html>
