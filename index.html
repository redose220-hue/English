<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOVEN Oral Lab</title>
    <style>
        :root {
            --primary-gold: #D4AF37;
            --light-gold: #F4EBD0;
            --bg-white: #FFFFFF;
            --text-dark: #333333;
            --accent-silver: #E5E4E2;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-white);
            color: var(--text-dark);
            margin: 0; padding-bottom: 50px;
            display: flex; flex-direction: column; align-items: center;
        }

        .container { width: 95%; max-width: 800px; padding: 20px; text-align: center; }

        h1 { color: var(--primary-gold); font-weight: 300; letter-spacing: 2px; margin-bottom: 20px; border-bottom: 1px solid var(--light-gold); padding-bottom: 10px; }

        /* 视频容器与盲听蒙层 */
        .video-wrapper { 
            position: relative; 
            width: 100%; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            background: #000;
            aspect-ratio: 16 / 9; /* 锁定比例防止塌陷 */
        }
        video { width: 100%; height: 100%; display: block; }
        
        .blind-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            display: none; align-items: center; justify-content: center;
            z-index: 100; color: var(--primary-gold); font-size: 20px; 
            font-weight: bold; letter-spacing: 2px; pointer-events: none;
        }

        .controls, .record-section, .list-section { margin-top: 15px; background: var(--light-gold); padding: 15px; border-radius: 15px; display: flex; flex-direction: column; gap: 10px; }

        button { padding: 12px 15px; border: none; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; font-size: 14px; font-weight: 500; flex: 1; }

        .btn-gold { background-color: var(--primary-gold); color: white; }
        .btn-silver { background-color: var(--accent-silver); color: var(--text-dark); }
        .btn-record { background-color: #e74c3c; color: white; }
        .btn-play-rec { background-color: #2ecc71; color: white; }
        .btn-save { background-color: #c5a02e; color: white; }
        
        /* 盲听按钮专用样式 */
        .btn-blind-toggle { 
            background-color: #333; 
            color: var(--primary-gold); 
            border: 2px solid var(--primary-gold); 
            font-weight: bold;
        }

        .row { display: flex; gap: 8px; justify-content: center; width: 100%; flex-wrap: wrap; }

        .time-display { font-family: monospace; font-size: 18px; color: var(--primary-gold); margin: 5px 0; }

        .list-section { background: transparent; padding: 0; border-radius: 0; }
        .snippet-item {
            background: #fff; border: 1px solid var(--light-gold);
            padding: 15px; border-radius: 10px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
            text-align: left; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .snippet-info { flex: 1; cursor: pointer; }
        .snippet-info b { display: block; font-size: 16px; margin-bottom: 4px; color: var(--primary-gold); }
        .snippet-info p { font-size: 14px; color: #555; margin: 4px 0; font-style: italic; }
        
        .btn-practice { background: var(--primary-gold); color: white; padding: 8px 15px; font-size: 12px; flex: none; width: auto; }
        .btn-delete { background: transparent; color: #ff4d4d; border: 1px solid #ff4d4d; margin-left: 5px; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }

        .status-dot { height: 10px; width: 10px; background-color: #bbb; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .recording { background-color: #e74c3c; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

<div class="container">
    <h1>MOVEN ORAL LAB</h1>
    
    <div class="video-wrapper">
        <div id="blindOverlay" class="blind-overlay">🙈 盲听模式中</div>
        <video id="mainVideo" controls playsinline></video>
    </div>
    
    <input type="file" id="fileInput" accept="video/*" style="margin: 15px 0;">

    <div class="controls">
        <!-- 盲听模式 这里的按钮这次一定要看见 -->
        <div class="row">
            <button id="blindBtn" class="btn-blind-toggle" onclick="toggleBlind()">🙈 开启盲听模式</button>
        </div>

        <div class="row">
            <button class="btn-silver" onclick="skip(-5)">⏪ 快退 5s</button>
            <button class="btn-silver" onclick="skip(-2)">⏪ 快退 2s</button>
        </div>

        <div class="time-display"><span id="startTime">0.0</span>s - <span id="endTime">0.0</span>s</div>
        
        <div class="row">
            <button class="btn-silver" onclick="setPoint('start')">📍 定起点</button>
            <button class="btn-silver" onclick="setPoint('end')">📍 定终点</button>
        </div>

        <div class="row">
            <button id="loopBtn" class="btn-gold" onclick="toggleLoop()">开启循环跟读</button>
            <button class="btn-save" onclick="saveSnippet()">💾 保存片段备注</button>
        </div>

        <select id="speed" onchange="changeSpeed()" style="padding: 10px; border-radius: 8px; border: 1px solid var(--primary-gold); background: white;">
            <option value="0.5">0.5x 慢速</option>
            <option value="0.75">0.75x 稍慢</option>
            <option value="1.0" selected>1.0x 正常</option>
            <option value="1.25">1.25x 快速</option>
        </select>
    </div>

    <div class="record-section">
        <div style="font-size: 13px; color: #666;"><span id="recordStatus" class="status-dot"></span> <span id="statusText">录音已就绪</span></div>
        <div class="row">
            <button id="recordBtn" class="btn-record" onclick="toggleRecord()">🎤 开始录制</button>
            <button id="playRecordBtn" class="btn-play-rec" onclick="playLastRecord()" disabled>▶️ 回放自读</button>
        </div>
    </div>

    <div id="snippetList" class="list-section"></div>
</div>

<script>
    const video = document.getElementById('mainVideo');
    const fileInput = document.getElementById('fileInput');
    const blindOverlay = document.getElementById('blindOverlay');
    const blindBtn = document.getElementById('blindBtn');
    
    let start = 0, end = 0, isLooping = false, isBlind = false;
    let mediaRecorder, audioChunks = [], audioUrl, isRecording = false;

    window.onload = loadSnippets;

    fileInput.addEventListener('change', (e) => { 
        const file = e.target.files[0];
        if (file) video.src = URL.createObjectURL(file); 
    });

    // 盲听模式切换
    function toggleBlind() {
        isBlind = !isBlind;
        blindOverlay.style.display = isBlind ? 'flex' : 'none';
        blindBtn.innerText = isBlind ? "👁️ 关闭盲听模式" : "🙈 开启盲听模式";
        blindBtn.style.backgroundColor = isBlind ? "var(--primary-gold)" : "#333";
        blindBtn.style.color = isBlind ? "#fff" : "var(--primary-gold)";
    }

    function skip(seconds) { video.currentTime = Math.max(0, video.currentTime + seconds); }

    function setPoint(type) {
        if (type === 'start') { 
            start = video.currentTime; 
            document.getElementById('startTime').innerText = start.toFixed(1); 
        } else { 
            end = video.currentTime; 
            document.getElementById('endTime').innerText = end.toFixed(1); 
        }
    }

    function toggleLoop() {
        isLooping = !isLooping;
        const btn = document.getElementById('loopBtn');
        btn.innerText = isLooping ? "停止循环" : "开启循环跟读";
        btn.style.background = isLooping ? "#333" : "var(--primary-gold)";
        if(isLooping) { video.currentTime = start; video.play(); }
    }

    video.addEventListener('timeupdate', () => { 
        if (isLooping && end > start && video.currentTime >= end) video.currentTime = start; 
    });

    function changeSpeed() { video.playbackRate = document.getElementById('speed').value; }

    function saveSnippet() {
        const name = prompt("片段名称："); if (!name) return;
        const note = prompt("备注/台词（可不填）：") || "";
        const snippet = { id: Date.now(), name: name, note: note, start: start, end: end };
        let snippets = JSON.parse(localStorage.getItem('moven_snippets') || '[]');
        snippets.unshift(snippet);
        localStorage.setItem('moven_snippets', JSON.stringify(snippets));
        loadSnippets();
    }

    function loadSnippets() {
        const listContainer = document.getElementById('snippetList');
        const snippets = JSON.parse(localStorage.getItem('moven_snippets') || '[]');
        listContainer.innerHTML = snippets.map(s => `
            <div class="snippet-item">
                <div class="snippet-info" onclick="editSnippet(${s.id})">
                    <b>${s.name}</b>
                    <p>${s.note ? s.note : '点击添加备注...'}</p>
                    <span style="font-size:11px; color:#aaa;">${s.start.toFixed(1)}s - ${s.end.toFixed(1)}s</span>
                </div>
                <div style="display:flex; align-items:center;">
                    <button class="btn-practice" onclick="practiceSnippet(${s.start}, ${s.end})">练这个</button>
                    <button class="btn-delete" onclick="deleteSnippet(${s.id})">×</button>
                </div>
            </div>
        `).join('');
    }

    function editSnippet(id) {
        let snippets = JSON.parse(localStorage.getItem('moven_snippets') || '[]');
        const idx = snippets.findIndex(s => s.id === id);
        if (idx === -1) return;
        const nName = prompt("修改片段名称：", snippets[idx].name); if (nName === null) return;
        const nNote = prompt("修改备注/台词：", snippets[idx].note); if (nNote === null) return;
        snippets[idx].name = nName; snippets[idx].note = nNote;
        localStorage.setItem('moven_snippets', JSON.stringify(snippets));
        loadSnippets();
    }

    function practiceSnippet(s, e) {
        start = s; end = e;
        document.getElementById('startTime').innerText = start.toFixed(1);
        document.getElementById('endTime').innerText = end.toFixed(1);
        isLooping = false; toggleLoop();
    }

    function deleteSnippet(id) {
        if(confirm("确定删除吗？")) {
            let snippets = JSON.parse(localStorage.getItem('moven_snippets') || '[]');
            localStorage.setItem('moven_snippets', JSON.stringify(snippets.filter(s => s.id !== id)));
            loadSnippets();
        }
    }

    async function toggleRecord() {
        const recordBtn = document.getElementById('recordBtn');
        const statusDot = document.getElementById('recordStatus');
        const statusText = document.getElementById('statusText');
        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    audioUrl = URL.createObjectURL(new Blob(audioChunks, { type: 'audio/wav' }));
                    document.getElementById('playRecordBtn').disabled = false;
                };
                mediaRecorder.start();
                isRecording = true; recordBtn.innerText = "⏹ 停止录制"; statusDot.classList.add('recording'); statusText.innerText = "正在录制...";
            } catch (err) { alert("请允许使用麦克风"); }
        } else {
            mediaRecorder.stop(); isRecording = false; recordBtn.innerText = "🎤 开始录制"; statusDot.classList.remove('recording'); statusText.innerText = "已保存";
        }
    }

    function playLastRecord() { if (audioUrl) new Audio(audioUrl).play(); }
</script>
</body>
</html>
